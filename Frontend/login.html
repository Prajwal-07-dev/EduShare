
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EduShare | Login</title>

    <link rel="stylesheet" href="style.css">

    <script src="config.js"></script>
    <script type="module" src="app.js"></script>
</head>

<body>

    <nav class="navbar">
        <a class="logo" href="index.html">📚 EduShare</a>
        <div class="nav-links" id="navLinks"></div>
    </nav>

    <main class="container">

        <form class="form-card" onsubmit="loginUser(event)">

            <div class="auth-icon">👋</div>

            <h1>Welcome Back!</h1>
            <p>Your notes and study buddies are waiting.</p>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input id="email" type="email" required
                    placeholder="Enter your email" autocomplete="email">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input id="password" type="password" required
                    placeholder="Enter your password"
                    autocomplete="current-password">
            </div>

            <p id="message" class="message" aria-live="polite"></p>

            <button type="submit" class="btn full-width">
                Login
            </button>

            <p style="margin-top: 18px;">
                Don't have an account?
                <a href="register.html">Register</a>
            </p>

        </form>

    </main>

    <footer>
        EduShare | Student Login
    </footer>

</body>
</html>
