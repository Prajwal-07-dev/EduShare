<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EduShare | Login</title>

    <link rel="stylesheet" href="style.css">

    <!-- Your existing JavaScript -->
    <script src="app.js" defer></script>

    <!-- Google Sign-In JavaScript -->
    <script type="module" src="google-signin.js"></script>
</head>

<body>

    <!-- Navigation Bar -->
    <nav class="navbar">
        <a class="logo" href="index.html">📚 EduShare</a>
        <div class="nav-links" id="navLinks"></div>
    </nav>

    <!-- Login Form -->
    <main class="container">

        <form class="form-card" onsubmit="loginUser(event)">

            <!-- Welcome Icon -->
            <div class="auth-icon">👋</div>

            <h1>Welcome Back!</h1>
            <p>Your notes and study buddies are waiting.</p>

            <!-- Email -->
            <div class="form-group">
                <label for="email">Email Address</label>
                <input id="email" type="email" required placeholder="Enter your email" autocomplete="email">
            </div>

            <!-- Password -->
            <div class="form-group">
                <label for="password">Password</label>
                <input id="password" type="password" required placeholder="Enter your password"
                    autocomplete="current-password">
            </div>

            <!-- Error / Success Message -->
            <p id="message" class="message" aria-live="polite"></p>

            <!-- Login Button -->
            <button type="submit" class="btn full-width">
                Login
            </button>

            <!-- Google Sign-In Button -->
            <button type="button" id="googleSignInBtn" class="google-btn">
                <img src="https://www.google.com/favicon.ico" alt="" width="18" height="18">
                Continue with Google
            </button>

            <!-- Registration Link -->
            <p style="margin-top: 18px;">
                Don't have an account?
                <a href="register.html">Register</a>
            </p>

        </form>

    </main>

    <!-- Footer -->
    <footer>
        EduShare | Student Login
    </footer>
    <script type="module" src="google-signin.js"></script>

</body>

</html>
