<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EduShare | Register</title>

    <link rel="stylesheet" href="style.css">

    <!-- Existing JavaScript -->
    <script src="app.js" defer></script>

    <!-- Google Sign-In -->
    <script type="module" src="google-signin.js"></script>
</head>

<body>

    <!-- Navigation Bar -->
    <nav class="navbar">
        <a class="logo" href="index.html">📚 EduShare</a>
        <div class="nav-links" id="navLinks"></div>
    </nav>

    <!-- Registration Form -->
    <main class="container">

        <form class="form-card" onsubmit="registerUser(event)">

            <!-- Welcome Icon -->
            <div class="auth-icon">🎓</div>

            <h1>Create your account</h1>
            <p>Your next study session starts here!</p>

            <!-- Full Name -->
            <div class="form-group">
                <label for="name">Full Name</label>
                <input id="name" name="name" type="text" required minlength="2" placeholder="Enter your name"
                    autocomplete="name">
            </div>

            <!-- Email Address -->
            <div class="form-group">
                <label for="email">Email Address</label>
                <input id="email" name="email" type="email" required placeholder="Enter your email"
                    autocomplete="email">
            </div>

            <!-- Password -->
            <div class="form-group">
                <label for="password">Password</label>
                <input id="password" name="password" type="password" required minlength="6"
                    placeholder="Minimum 6 characters" autocomplete="new-password">
            </div>

            <!-- Confirm Password -->
            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input id="confirmPassword" name="confirmPassword" type="password" required minlength="6"
                    placeholder="Re-enter your password" autocomplete="new-password">
            </div>

            <!-- Error or Success Message -->
            <p id="message" class="message" aria-live="polite"></p>

            <!-- Register Button -->
            <button type="submit" class="btn full-width">
                Register
            </button>

            <!-- Google Sign-In Button -->
            <button type="button" id="googleSignInBtn" class="google-btn">
                <img src="https://www.google.com/favicon.ico" alt="" width="18" height="18">
                Continue with Google
            </button>

            <!-- Login Link -->
            <p style="margin-top: 18px;">
                Already registered?
                <a href="login.html">Login</a>
            </p>

        </form>

    </main>

    <!-- Footer -->
    <footer>
        EduShare | Student Registration
    </footer>
    <script type="module" src="google-signin.js"></script>

</body>

</html>
