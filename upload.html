<!DOCTYPE html>
<html lang="en">

<head>
    <script type="module" src="app.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EduShare | Upload Notes</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navigation Bar -->
    <nav class="navbar">
        <a class="logo" href="index.html">📚 EduShare</a>
        <div class="nav-links" id="navLinks"></div>
    </nav>

    <!-- Upload Notes Form -->
    <main class="container">

        <form class="form-card" onsubmit="uploadNote(event)">

            <h1>Upload Study Notes</h1>
            <p>Share your notes with the EduShare student community.</p>

            <!-- Note Title -->
            <div class="form-group">
                <label for="title">Note Title</label>
                <input id="title" type="text" required placeholder="Enter note title">
            </div>

            <!-- Subject -->
            <div class="form-group">
                <label for="subject">Subject</label>
                <input id="subject" type="text" required placeholder="Enter subject name">
            </div>

            <!-- Semester -->
            <div class="form-group">
                <label for="semester">Semester</label>
                <select id="semester" required>
                    <option value="">Select Semester</option>
                    <option value="1">Semester 1</option>
                    <option value="2">Semester 2</option>
                    <option value="3">Semester 3</option>
                    <option value="4">Semester 4</option>
                    <option value="5">Semester 5</option>
                    <option value="6">Semester 6</option>
                    <option value="7">Semester 7</option>
                    <option value="8">Semester 8</option>
                </select>
            </div>


            <!-- Branch Selection -->
            <div class="form-group">
                <label for="branch">Branch</label>

                <select id="branch" name="branch" class="search-input" required>
                    <option value="">Select Branch</option>
                    <option value="CSE">Computer Science (CSE)</option>
                    <option value="IT">Information Science (IS)</option>
                    <option value="ECE">Electronics and Communication (EC)</option>
                    <option value="IC">CSIOT</option>
                    <option value="MECH">Mechanical (MECH)</option>
                    <option value="CIVIL">Civil Engineering (CIVIL)</option>
                    <option value="CI">Computer Science AIML (CI)</option>
                </select>
            </div>
            <div class="form-group">
                <label for="category">Category</label>

                <select id="category" name="category" required>
                    <option value="">Select Category</option>
                    <option value="Notes">Notes</option>
                    <option value="Question Papers">Question Papers</option>
                    <option value="Lab Manuals">Lab Manuals</option>
                    <option value="Assignments">Assignments</option>
                </select>
            </div>

            <!-- Description -->
            <div class="form-group">
                <label for="description">Description (Optional)</label>
                <textarea id="description" rows="4" placeholder="Write a short description about your notes"></textarea>
            </div>

            <!-- File Upload -->
            <div class="form-group">
                <label for="file">Select Notes File</label>

                <input type="file" id="file" name="file" class="search-input" accept="*/*" required>

                <small>Any file type allowed • Maximum 10 MB</small>
            </div>

            <!-- Message -->
            <p id="message" class="message" aria-live="polite">
            </p>

            <!-- Submit Button -->
            <button type="submit" class="btn full-width">
                Upload Notes
            </button>

            <!-- Back Link -->
            <p style="margin-top:18px">
                <a href="dashboard.html" style="color:#2563eb">
                    Back to Dashboard
                </a>
            </p>

        </form>

    </main>

    <!-- Footer -->
    <footer>
        EduShare | Share Knowledge, Learn Together
    </footer>

</body>

</html>
