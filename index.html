<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduShare | Register</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>

<body>

  <nav class="navbar">
    <a class="logo" href="index.html">📚 EduShare</a>
    <div class="nav-links" id="navLinks"></div>
  </nav>

  <main class="container">
    <form class="form-card" onsubmit="registerUser(event)">
      <h1>Create Account</h1>
      <p>Join the EduShare student community.</p>

      <div class="form-group">
        <label for="name">Full Name</label>
        <input id="name" type="text" required placeholder="Enter your name">
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input id="email" type="email" required placeholder="Enter your email">
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input id="password" type="password" minlength="6" required placeholder="Minimum 6 characters">
      </div>
      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Re-enter your password"
          required>
      </div>

      <p id="message" class="message" aria-live="polite"></p>

      <button type="submit" class="btn full-width">
        Register
      </button>

      <p style="margin-top:18px">
        Already registered?
        <a href="login.html" style="color:#2563eb">Login</a>
      </p>
    </form>
  </main>

  <footer>EduShare | Student Registration</footer>

</body>

</html>
